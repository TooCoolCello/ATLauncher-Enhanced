name: Test Build

# Fork only: tests and builds every pushed feature/fix branch, then replaces the "test-build" pre-release
# with the jar, so the newest build can be run without IntelliJ (scripts/run-test-build.bat).
on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

# a newer push makes an older build pointless, whichever branch it was on
concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          add-job-summary: never

      - name: Run Unit Tests
        run: ./gradlew --no-daemon test

      - name: Build Jar
        run: ./gradlew --no-daemon shadowJar

      - name: Publish test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=(build/libs/ATLauncher-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then echo "Expected one jar, found: ${jars[*]}"; exit 1; fi
          cp "${jars[0]}" ATLauncher-Enhanced.jar

          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build ATLauncher-Enhanced.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build: $GITHUB_REF_NAME" \
            --notes "Built from \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Run it with scripts/run-test-build.bat."
